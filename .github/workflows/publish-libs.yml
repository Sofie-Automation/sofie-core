name: Publish libraries

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    tags:
      - "v**"

permissions:
  contents: read

env:
  IS_UPSTREAM: ${{ github.repository_owner == 'Sofie-Automation' }}
  NPM_PACKAGE_SCOPE: ${{ vars.NPM_PACKAGE_SCOPE }} # In the form of nrkno, without the @
  NPM_PACKAGE_PREFIX: ${{ vars.NPM_PACKAGE_PREFIX }} # Set to anything to prefix the published package names with "sofie-". eg in combination with NPM_PACKAGE_SCOPE this will turn @sofie-automation/shared-lib into @nrkno/sofie-shared-lib

jobs:
  check-publish:
    name: Check if publish is possible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      can-publish: ${{ steps.check.outputs.can-publish }}
      npm-scope: ${{ steps.check.outputs.npm-scope }}

    steps:
      - name: Check release is possible
        id: check
        run: |
          if [ "${{ env.IS_UPSTREAM }}" = "true" ]; then
            echo "Upstream repo, publishing unscoped" >> $GITHUB_STEP_SUMMARY
            echo "can-publish=1" >> $GITHUB_OUTPUT
            echo "npm-scope=" >> $GITHUB_OUTPUT
          elif [ "${{ env.NPM_PACKAGE_SCOPE }}" = "" ]; then
            echo "No NPM_PACKAGE_SCOPE set, not publishing" >> $GITHUB_STEP_SUMMARY
            echo "can-publish=0" >> $GITHUB_OUTPUT
            echo "npm-scope=" >> $GITHUB_OUTPUT
          else
            echo "Downstream repo, publishing scoped to \`@${{ env.NPM_PACKAGE_SCOPE }}\`" >> $GITHUB_STEP_SUMMARY
            echo "can-publish=1" >> $GITHUB_OUTPUT
            echo "npm-scope=${{ env.NPM_PACKAGE_SCOPE }}" >> $GITHUB_OUTPUT
          fi

  lint-packages:
    name: Lint packages
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15

    needs: check-publish

    if: ${{ needs.check-publish.outputs.can-publish == '1' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Prepare Environment
        run: |
          corepack enable

          yarn config set cacheFolder /home/runner/publish-docs-cache
          yarn install
          yarn build:all
        env:
          CI: true
      - name: Run typecheck and linter
        run: |
          yarn lint
        env:
          CI: true

  test-packages:
    name: Test Lib
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: check-publish

    if: ${{ needs.check-publish.outputs.can-publish == '1' }}

    strategy:
      fail-fast: false
      matrix:
        package-name:
          - blueprints-integration
          - server-core-integration
          - shared-lib
          # - live-status-gateway-api # no tests yet
          - openapi
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Prepare Environment
        run: |
          corepack enable

          yarn install

          if [ "${{ matrix.package-name }}" = "openapi" ]; then
            yarn workspace @sofie-automation/openapi run build
          else
            yarn build:single packages/${{ matrix.package-name }}/tsconfig.build.json
          fi
        env:
          CI: true
      - name: Run tests
        run: |
          cd packages/${{ matrix.package-name }}
          yarn unit
        env:
          CI: true

  prepare-publish:
    name: Prepare for publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: check-publish

    if: ${{ needs.check-publish.outputs.can-publish == '1' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Prepare Environment
        run: |
          corepack enable

          yarn config set cacheFolder /home/runner/lint-core-cache
          yarn install
        env:
          CI: true
      - name: Bump version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config --global user.email "info@superfly.tv"
          git config --global user.name "superflytvab"

          # This appends the commit date and hash to the prerelease name.
          # Always a patch bump, as the shallow checkout has no history to determine the bump from
          yarn release --prerelease "nightly-$REF_NAME" --release-as patch
        env:
          CI: true
          REF_NAME: ${{ github.ref_name }}
      - name: Build
        run: |
          yarn build
        env:
          CI: true

      - name: Build OpenAPI client library
        run: |
          yarn workspace @sofie-automation/openapi build
        env:
          CI: true
      - name: Modify dependencies to use npm packages
        run: |
          node scripts/prepublish.js "${{ github.repository }}" "${{ env.NPM_PACKAGE_SCOPE }}" ${{ env.NPM_PACKAGE_PREFIX }}

          yarn install --no-immutable

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish-dist
          path: |
            packages/*/dist
            packages/*/package.json
            package.json
            yarn.lock
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - prepare-publish
      - test-packages

    permissions:
      contents: write
      id-token: write # scoped for as short as possible, as this gives write access to npm

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: publish-dist

      - name: Publish to NPM
        id: publish-npm
        run: |
          # If an npm token is provided, use it (for simpler setup in forks)
          if [ "${{ secrets.NPM_TOKEN }}" != "" ]; then
            echo "Using provided NPM token"
            export YARN_NPM_AUTH_TOKEN="${{ secrets.NPM_TOKEN }}"
          else
            echo "No NPM token provided, using trusted publishing"
          fi

          corepack enable

          yarn install

          NEW_VERSION=$(node -p "require('./packages/shared-lib/package.json').version")

          NPM_TAG=nightly
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PACKAGE_NAME=$(node -p "require('./packages/shared-lib/package.json').name")
            PUBLISHED_VERSION=$(yarn npm info --json $PACKAGE_NAME | jq -c '.version' -r)
            NPM_TAG=$(node scripts/determine-npm-tag.js "$PUBLISHED_VERSION" "$NEW_VERSION")
          fi

          # Publish every public workspace, dependencies first. Versions already on npm are skipped
          yarn workspaces foreach --all --topological --no-private --verbose \
            npm publish --access public --tag $NPM_TAG --provenance --tolerate-republish

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "**Published:** $NEW_VERSION as $NPM_TAG" >> $GITHUB_STEP_SUMMARY
        env:
          CI: true

$defs:
  timerStateRunning:
    $ref: './timerState/running/timerStateRunning.yaml#/$defs/timerStateRunning'

  timerStatePaused:
    $ref: './timerState/paused/timerStatePaused.yaml#/$defs/timerStatePaused'

  timerState:
    title: TimerState
    description: >-
      Runtime state of a timer, optimized for efficient client rendering. The client calculates the
      current value from its own clock. Thus the state changes only when an event occurs, not as time
      passes. When the timer runs, the client calculates the current value from `zeroTime`, until
      `pauseTime` if `pauseTime` is set. When the timer is paused, the value is `duration`, until
      `resumesAt` if `resumesAt` is set.

      Sofie's timing fields send the two types of transition in advance. Examples are a running timer
      that holds when the on-air part overruns, and a paused timer that starts at the start of a part.
    oneOf:
      - $ref: '#/$defs/timerStateRunning'
      - $ref: '#/$defs/timerStatePaused'
    examples:
      - $ref: './timerStateRunning-example.yaml'
      - $ref: './timerStatePaused-example.yaml'
